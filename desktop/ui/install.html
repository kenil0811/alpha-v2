<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alpha</title>
    <style>
      :root { color-scheme: light dark; --canvas: #fbfbfb; --surface: #ffffff; --ink: #131313; --ink-2: #383838; --ink-3: #6f6f6f; --line: #dcdcdc; --accent: #2563eb; --bad: #ad3d36; }
      @media (prefers-color-scheme: dark) { :root { --canvas: #191919; --surface: #202020; --ink: #ededed; --ink-2: #c2c2c2; --ink-3: #959595; --line: #333333; --accent: #6ea8fe; --bad: #e08a84; } }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--canvas); color: var(--ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none; }
      header { height: 48px; flex: none; }
      main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 36px 28px; }
      h1 { font: 500 24px/1.3 Georgia, serif; margin: 0; }
      p { margin: 0; color: var(--ink-2); max-width: 46em; }
      .row { display: flex; gap: 10px; align-items: center; }
      button { font: inherit; height: 32px; padding: 0 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      pre { flex: 1; min-height: 120px; margin: 0; padding: 12px 14px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; -webkit-user-select: text; }
      .problem { color: var(--bad); }
      label { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <header data-tauri-drag-region></header>
    <main>
      <h1 id="title">Install Alpha</h1>
      <p id="words">Alpha will be put in Applications, keep its data in your Library, and start when you log in. Nothing leaves this Mac.</p>
      <label id="back" class="hidden"><input id="bring" type="checkbox" checked /> <span id="day"></span></label>
      <div class="row">
        <button id="go" class="primary" type="button">Install</button>
        <button id="quit" type="button">Decline</button>
        <button id="restart" class="primary hidden" type="button">Restart now</button>
        <span id="state"></span>
      </div>
      <pre id="log" class="hidden"></pre>
    </main>
    <script>
      const inv = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args)
      const $ = (id) => document.getElementById(id)
      // what this install is: fresh, or an update from the version installed
      inv('install_plan').then((p) => {
        if (p.windows)
          $('words').textContent =
            'Alpha will be put in your apps, keep its data on this PC, and start when you sign in. Windows may ask you once to turn on its Subsystem for Linux, and to restart. Nothing leaves this PC.'
        if (p.from) {
          $('title').textContent = `Update Alpha ${p.from} to ${p.to}`
          $('words').textContent = 'Your data and settings stay as they are; they are backed up first.'
          $('go').textContent = 'Update'
        } else {
          $('title').textContent = `Install Alpha ${p.to}`
        }
        // a PC where Alpha was uninstalled: its saved data, brought back unless unticked
        if (p.saved && !p.carry_on) {
          $('day').textContent = `Bring back your data saved on ${p.saved}`
          $('back').classList.remove('hidden')
        }
      })
      // the installer's lines, as it goes
      window.addLine = (line) => {
        const log = $('log')
        log.classList.remove('hidden')
        log.textContent += `${line}\n`
        log.scrollTop = log.scrollHeight
      }
      // how it ended: done (true, or 'done'), failed (false, or 'failed'), or, on Windows, a restart
      // to finish turning WSL on, after which this window comes back by itself
      window.installEnded = (state, words) => {
        const ok = state === true || state === 'done'
        const restart = state === 'restart'
        $('state').textContent = words
        $('state').className = ok || restart ? '' : 'problem'
        $('go').disabled = ok || restart
        $('go').classList.toggle('hidden', restart)
        $('restart').classList.toggle('hidden', !restart)
        $('quit').disabled = false
        $('quit').textContent = ok ? 'Close' : restart ? 'Later' : 'Decline'
      }
      // after the restart, what was chosen before it comes with the app's own start
      const start = (again) => {
        $('go').disabled = true
        $('quit').disabled = true
        $('bring').disabled = true
        $('state').textContent = 'Installing…'
        const shown = !$('back').classList.contains('hidden')
        inv('install', { bringBack: !again && shown && $('bring').checked })
      }
      $('go').onclick = () => start(false)
      $('restart').onclick = () => inv('install_restart')
      $('quit').onclick = () => inv('install_quit')
      // back after the restart: it carries on by itself
      inv('install_plan').then((p) => {
        if (p.carry_on) start(true)
      })
    </script>
  </body>
</html>
