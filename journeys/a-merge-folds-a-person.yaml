name: a-merge-folds-a-person
title: 'two people merged are one row in a per-person table, every row naming them names the kept one, and an unmerge puts both back'
why: >
  Core step 3d (Kenil's yes, 27 Oct). Before it, merging two people left both their Closeness
  rows, each showing the kept person, and kept the merged-in person's old id on their Members
  rows, which the Closeness agent then skipped. Network's circles are set up as in
  network-circles; two advisers are then merged by the person, and later told apart.
steps:
  - kit: { from: core/kits/network, agents: [Circles, Closeness, LinkedIn export] }
  - folder: { from: journeys/fixtures/linkedin }
  - due: true
    checks:
      - rows_in: { table: LinkedIn, count: 8 }
  - due: true
    checks:
      - card: { gate: rows, words: 'look like Advisers' }
  - review: { choice: In }
  - due: true
    checks:
      - person_rows: { table: Closeness, person: Sam Ortiz, count: 1 }
      - person_rows: { table: Closeness, person: Tom Becker, count: 1 }
  - merge: { keep: Sam Ortiz, other: Tom Becker }
    checks:
      - person_rows: { table: Closeness, person: Sam Ortiz, count: 1 }
      - person_rows: { table: Members, person: Sam Ortiz }
      - errors: 0
  - due: true
    checks:
      - person_rows: { table: Closeness, person: Sam Ortiz, count: 1 }
      - errors: 0
  - unmerge: Tom Becker
    checks:
      - person_rows: { table: Closeness, person: Sam Ortiz, count: 1 }
      - person_rows: { table: Closeness, person: Tom Becker, count: 1 }
      - person_rows: { table: Members, person: Tom Becker }
      - errors: 0
