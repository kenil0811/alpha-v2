name: a-task-waits-for-its-day
title: 'A task told to start later, and a repeating task, wait for their day'
why: >
  Agents on a schedule: a task given to an agent normally starts at once, but it can be told to
  start later, and a repeating one starts each copy on its own day. A made-up firm's agent, on a
  fresh tenant.
steps:
  - say: Make an agent called Pricer. It answers what things cost. Its instructions are to be brief.
    checks:
      - agents: 1
      - errors: 0
  - say: Add a task called "Price a widget" and give it to Pricer, to start tomorrow at 9 in the morning.
    checks:
      - task: { title: Price a widget, state: todo, count: 1 }
      - errors: 0
  - say: Add a task called "Weekly review", due next Monday and repeating every Monday, and give it to Pricer.
    checks:
      - task: { title: Weekly review, state: todo, count: 1 }
      - errors: 0
