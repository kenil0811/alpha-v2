name: an-interview-gets-to-know-you
title: The owner of a small firm goes through Set up Alpha, allows what Alpha may read, and ends with About you and a report of their work
why: >
  Onboarding redesigned (Kenil's calls, 22 Nov): Set up Alpha is a story of chapters drawn by code,
  never a chat (calls 1 to 3). Welcome, Your workspace with who the work is for in the owner's own
  words, Connect with counts from code, connecting being the permission to read, so a source
  not connected is never read or cited (calls 15, 16; one page, 23 Nov), Invite
  team, What I learned, A few questions and Off your plate (calls 17, 18), Done. Nothing lands in How to work
  without the person's Keep, a declined proposal never comes back, hours are computed in code or
  marked estimated with their basis, every report row cites what it rests on, and none of it sits
  in Needs you. A made-up renovation firm, on recorded mail, events, contacts and browsing, and a
  made-up site.
plugins: [interviews]
fixtures: an-interview-gets-to-know-you
steps:
  - site: { from: journeys/fixtures/sites/oak-street }
  - connect: { connector: gmail, account: sam@oakstreetbuilders.example }
    checks:
      - rows_in: { table: Mail, count: 31 }
      # a fresh Alpha's owner is in the story, its interview chapters there with interviews on, and
      # no Claude chapter while a model is set (calls 4, 7)
      - story:
          chapters: [welcome, workspace, computer, connect, people, learned, questions, plate, done]
          at: welcome
          done: false
  # the person's computer: a folder lent (to be turned off), Calendar, Contacts and browsing
  - bridge:
      lend: '{tmp}/Office'
      put: { name: Oak Street staff bonus plan.csv, text: "Name,Bonus\nLee,1200\n" }
      calendar: true
      contacts: true
    checks:
      - rows_in: { table: Events, count: 13 }
      - errors: 0
  - bridge: { browsing: true, ai: true }
    checks:
      - errors: 0
  - story: { chapter: welcome }
    checks:
      # the three promises, the never-use list among them in one sentence (call 25)
      - story_says: { chapter: welcome, matches: 'banking' }
  # who the work is for, in the owner's own words, and their site confirmed (call 20)
  - story:
      chapter: workspace
      body:
        for: 'Oak Street Builders, my renovation firm: me, Lee who runs the sites, and four carpenters.'
        site: '{site}'
    checks:
      - story: { at: computer }
  - story: { chapter: computer }
  # Connect: what landed, counted by code, never in a model's words (calls 8, 13)
  - story: { chapter: connect }
    checks:
      - story_says: { chapter: connect, matches: '31' }
  # Invite team fills the time the reading and the draft take (calls 19, 22)
  - story: { chapter: people, body: { add: [{ name: Lee, email: lee@oakstreetbuilders.example }] } }
  # connecting is the permission: what is connected is read as What I learned opens, but the
  # folder, turned off in Interview sources (calls 15, 16; rules I3)
  - story: { chapter: learned, body: { read: { off: [folder] } } }
    checks:
      - rows_in: { table: Sites, at_least: 3 }
      - rows_in: { table: AI requests, at_least: 3 }
      - errors: 0
  - story:
      chapter: learned
      # About you (call 18): the first line dropped, the rest kept
      drop: 1
      answers:
        # the playback: the first proposal declined, the rest taken
        - match: "We'd build"
          choice: Not this
          times: 1
        - match: "We'd build"
          choice: "Yes, that's it"
        # the blanks only the person can fill, as a set, one at a time (call 17)
        - match: 'quote'
          choice: 'About 45 minutes each, at the kitchen table in the evening, from my notes of the site visit.'
        - match: 'invoice|overdue|payment|chas'
          choice: 'About 10 minutes each, every Friday afternoon. It is the job I like least.'
        - match: 'electric|Ravi|subcontract|schedul|carpenter'
          choice: 'About 20 minutes a week, texting each of them one by one.'
    checks:
      # the report: every row cites what it rests on, each workflow closes
      - rows_in: { table: Workflows, at_least: 2 }
      - cited: { table: Workflows }
      - cited: { table: Steps }
      - cited: { table: Proposals }
      - each_has: { table: Workflows, part: Proposals }
      # hours from code, or estimated with what they rest on (rules I2)
      - numbers: { table: Workflows, field: Hours a month }
      # the folder was turned off: nothing rests on it, and no name only it held appears (I3)
      - never_cited: { module: Your work, source: Files }
      - nowhere: { matches: 'bonus plan', module: Your work }
      # nothing in How to work without the person's Keep
      - how_to_work: { for: me, kept: true, at_least: 1 }
      - how_to_work: { for: everyone, kept: true, at_least: 1 }
      # a declined proposal never comes back (rules I4)
      - asked_once: { matches: "We'd build", answered: 'Not this' }
  - story: { chapter: done }
    checks:
      - story: { done: true, row: null }
      # none of it waited in Needs you beside the firm's real asks
      - needs_you: { count: 0 }
      # nothing went out, and nothing failed
      - connector_calls: { words: 'Gmail: send', count: 0 }
      - errors: 0
