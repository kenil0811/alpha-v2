name: a-reader-for-a-list
title: 'A list on a site becomes a reader that runs every day, reading every page with no card'
why: >
  Listing readers, generically: Alpha looks at a list the way a person sees it, keeps a reader and
  its schedule in a module, and tries it. Sites open with no card unless the owner asks before new
  ones (docs/rules.md L1), so the reader reads both pages into a table, each row keeping its page
  as its source. The site is a made-up one served on this Mac, never a real one.
steps:
  - site: { from: journeys/fixtures/sites/firms }
  - say: >-
      Firms for sale are listed at {site}/list.html. Keep a reader that brings each one into a
      table Firms with its email, every day at 9, and try it now.
    checks:
      - permission_cards: 0
      - schedules_on: 1
      - rows_in: { table: Firms, count: 3 }
      - looked_up_from: { table: Firms, url: '/firm/' }
      - last_run: ok
      - errors: 0
