name: mail-on-recorded-answers
title: Mail lands in a table, a question is answered from it, and a send waits on its card
why: >
  The first day's sentence 8: a draft to a broker waits for the person's yes and goes.
  Kenil, 19 Oct: a draft goes to no one, so it does not wait; a send does. On recorded answers
  (journeys/fixtures/gmail), never a real account.
steps:
  - connect: { connector: gmail, account: owner@example.com }
    checks:
      - rows_in: { table: Mail, count: 6 }
  - say: who has emailed me about deals this week?
    checks:
      - reply_matches: 'Priya'
      - reply_matches: 'Marco'
      - permission_cards: 0
  - say: draft a reply to Priya asking her to send the CIM once I sign the NDA, then send it
    checks:
      - card: { gate: leaves_world, words: 'priya@harborcapital\.example', detail: 'CIM' }
      - connector_calls: { words: 'Gmail: send', count: 0 }
  - answer: { choice: 'Yes' }
    checks:
      - connector_calls: { words: 'Gmail: send', count: 1 }
      - cards_waiting: 0
      - errors: 0
  # Kenil, 29 Oct: "send it" after a draft sends that draft, not a new email beside it
  - say: draft an email to Marco thanking him for the call, and don't send it
    checks:
      - cards_waiting: 0
  - say: now send it
    checks:
      - card: { gate: leaves_world, words: 'Send your draft to .*marco@brokerage' }
      - connector_calls: { words: 'Gmail: send', count: 1 }
  - answer: { choice: 'Yes' }
    checks:
      - connector_calls: { words: 'Gmail: send', count: 2 }
      - cards_waiting: 0
      - errors: 0
  # step 2, part 2 (Kenil's yes, 30 Oct): Revert on a turn that saved a draft deletes it again
  - say: draft an email to Priya thanking her for the NDA, and don't send it
    checks:
      - cards_waiting: 0
  - revert: last_turn
    checks:
      - connector_calls: { words: 'Gmail: discard', count: 1 }
      - reverted: 'Deleted the draft to .*priya@harborcapital'
      - errors: 0
