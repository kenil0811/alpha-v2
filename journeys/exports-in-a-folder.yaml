name: exports-in-a-folder
title: The six RestoPros exports in a watched folder become documents, read cell by cell
why: >
  Avilo's first day, sentence 2 (design §16): she drops the six exports in the folder and every
  number opens to its cell. Week 2 makes the folder and the reading; the report is Accounting's.
steps:
  - folder: { from: ../requirements/avilo, only: RestoPros }
    checks:
      - documents: 6
  - say: from the RestoPros exports, what was total income in June 2026, and which cell is it in?
    checks:
      - reply_matches: '44,?488\.52'
      - reply_matches: 'N13'
      - permission_cards: 0
      - errors: 0
