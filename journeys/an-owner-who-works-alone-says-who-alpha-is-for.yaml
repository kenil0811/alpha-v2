name: an-owner-who-works-alone-says-who-alpha-is-for
title: Someone who works alone, with no site, says in Your workspace that Alpha is just for them; their lines land in For you, and no mail provider is taken for their site
why: >
  Onboarding redesigned (Kenil's calls, 22 Nov, call 20, carrying the 18 Nov call 10) for an owner
  who works alone. A site is never guessed from a mail provider's domain, so Your workspace offers
  none; the drafts leave out what does not apply, and kept lines land in How to work › For you,
  since there is no one else here. A made-up freelance bookkeeper with a Gmail address, who lets
  Alpha read nothing.
plugins: [interviews]
steps:
  - connect: { connector: gmail, account: jo.reyes@gmail.com }
  - story: { chapter: welcome }
    checks:
      # no site offered from a mail provider's domain
      - story_says: { chapter: workspace, never: 'gmail\.com' }
  - story: { chapter: workspace, body: { for: 'Just me. I do the books for a handful of small shops in town, on my own.' } }
  - story: { chapter: connect }
  - story: { chapter: know, body: { off: [mail, calendar, contacts, alpha] } }
  # Your people: no one to add, so skipped
  - story: { chapter: people, skip: true }
  - story:
      chapter: learned
      answers:
        - match: 'system|software|tool'
          choice: 'Ledgerly for my clients’ books, and a spreadsheet for each client.'
    checks:
      # a mail provider is never read as their site
      - web_calls: { matches: 'gmail\.com', count: 0 }
      # their lines, for them alone, each kept; nothing for everyone, and no firm or team made up
      - how_to_work: { for: me, kept: true, at_least: 1, matches: 'book' }
      - how_to_work: { for: everyone, count: 0 }
      - nowhere: { matches: '\bfirm\b|your team', module: Your work }
      - errors: 0
  - story: { chapter: done }
    checks:
      - story: { done: true }
