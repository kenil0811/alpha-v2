name: an-owner-who-works-alone-says-who-alpha-is-for
title: Someone who works alone, with no site, says in About you that Alpha is for personal work; their lines land in For you, and no mail provider is taken for their site
why: >
  Onboarding redesigned (Kenil's calls, 22 Nov, call 20, carrying the 18 Nov call 10) for an owner
  who works alone, on one page since 23 Nov: About you asks business or personal. A site is never
  guessed from a mail provider's domain, so About you offers none; connecting their mail is the
  permission to learn from it (rules I3); and since Alpha is for their personal work, kept lines
  land in How to work › For you, never For everyone here. A made-up Gmail address, its recorded mail
  the only thing read.
plugins: [interviews]
steps:
  - connect: { connector: gmail, account: jo.reyes@gmail.com }
  - story: { chapter: welcome }
    checks:
      # no site offered from a mail provider's domain
      - story_says: { chapter: workspace, never: 'gmail\.com' }
  - story: { chapter: workspace, body: { use: personal } }
  - story: { chapter: computer, skip: true }
  - story: { chapter: connect }
  # Invite team: no one to add, so skipped
  - story: { chapter: people, skip: true }
  # their mail is read, nothing else
  - story: { chapter: learned, body: { read: { off: [calendar, contacts, alpha] } } }
  - story:
      chapter: learned
      answers:
        - match: 'system|software|tool'
          choice: 'A spreadsheet for each client, and my mail.'
    checks:
      # a mail provider is never read as their site
      - web_calls: { matches: 'gmail\.com', count: 0 }
      # their lines, for them alone, each kept; nothing for everyone
      - how_to_work: { for: me, kept: true, at_least: 1 }
      - how_to_work: { for: everyone, count: 0 }
      - errors: 0
  - story: { chapter: done }
    checks:
      - story: { done: true }
