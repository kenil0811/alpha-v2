name: a-mirror-follows-its-source
title: A correction on a mirror is kept in Alpha, beside the source's value, and the mirror's rows follow the source
why: >
  Rules step 1 (docs/rules.md, D6, D8): Gmail on recorded answers (journeys/fixtures/gmail), never a
  real account. The person corrects a subject; a read keeps Gmail's value beside it and Reset
  brings Gmail's back (step 4); a message cannot be removed in Alpha (step 5). A message deleted at
  the source, kept and marked gone, waits on Gmail's newer sync; Outlook's is tested with its
  connector.
steps:
  - connect: { connector: gmail, account: owner@example.com }
  - edit:
      table: Mail
      row: <deal-1@harbor.example>
      field: Subject
      to: 'Harbor deal: restoration contractor, St. Louis MO'
  - read_now: gmail
    checks:
      - beside:
          table: Mail
          key: <deal-1@harbor.example>
          field: Subject
          equals: 'Harbor deal: restoration contractor in St. Louis'
  - reset: { table: Mail, row: <deal-1@harbor.example>, field: Subject }
    checks:
      - field:
          table: Mail
          key: <deal-1@harbor.example>
          field: Subject
          equals: 'Harbor deal: restoration contractor in St. Louis'
  - remove: { table: Mail, row: <deal-1@harbor.example> }
    checks:
      - rows_in: { table: Mail, count: 7 }
