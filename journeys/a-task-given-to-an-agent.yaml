name: a-task-given-to-an-agent
title: 'A task given to an agent is worked in its own thread and ends Done'
why: >
  Clean base, after step 7: a task can be given to an agent, which works on it in the task's own
  thread while its chat stays free. The task ends Done by itself with the result in the thread.
  A made-up firm's agent, on a fresh tenant.
steps:
  - say: >
      Make an agent called Pricer. It answers what things cost, and its instructions are: a widget
      costs 12 dollars, the source is the price list.
    checks:
      - agents: 1
      - errors: 0
  - say: Add a task called "Price a widget" and give it to Pricer.
    checks:
      - errors: 0
      - reply_matches: '12'
