name: remove-the-eggs
title: 'a removal the person asked for in removal words goes without a card; any other removal asks'
why: >
  The deletes-own gate opens no card when the person asked for the removal in their
  own words. Code finds the model's quote in what they typed this turn, and the quote must say
  removal (core/config/words.yaml), so three letters of a message never count as an ask (item 11
  of the problems list, 25 Oct).
steps:
  - say: track what I eat
    checks:
      - tables: 1
      - errors: 0
  - say: log two eggs for lunch
    checks:
      - rows: 1
      - permission_cards: 0
  - say: remove the eggs
    checks:
      - rows: 0
      - permission_cards: 0
      - errors: 0
  - say: log an apple for a snack
    checks:
      - rows: 1
  - say: I don't want the apple in there any more
    checks:
      - permission_cards: 1
      - rows: 1
      - errors: 0
