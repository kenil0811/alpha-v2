name: pdf-with-places
title: A balance sheet PDF in a folder is read by Docling, and a figure is answered with its page
why: >
  Week 2 (design §8): PDFs read with positions. Kenil agreed Docling at about 1.6 GB, set up on
  the first PDF (19 Oct). The sample is requirements/avilo/Balance Sheet Example.pdf.
steps:
  - folder: { from: ../requirements/avilo, only: Balance Sheet Example }
    checks:
      - documents: 1
      - errors: 0
  - say: in the balance sheet PDF, what are total liabilities, and on which page?
    checks:
      - reply_matches: '2,?887,?230'
      - reply_matches: 'page 2'
      - errors: 0
