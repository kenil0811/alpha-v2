name: a-mirror-change-is-a-request
title: A change to a mirror's writable field is a request that leaves the world on a card, confirmed by a read
why: >
  docs/rules.md, D9 to D12: a made-up case system whose connector declares one writable field,
  Status. "Close case 1042" puts an outward card up; after Yes the row keeps its value, waiting,
  until Read now shows the system took it. A change after the record changed at the source is
  refused as stale. Every check waits on Dell's contract, the work that builds the made-up
  connector (journeys/fixtures/connectors/cases).
steps:
  - connector: { from: journeys/fixtures/connectors/cases, account: '{tmp}' }
  - say: Close case 1042.
    checks:
      - card: { gate: leaves_world, words: '1042', detail: 'Closed' }
        waits: Dell's contract
  - answer: { choice: 'Yes' }
    checks:
      - field: { table: Cases, key: '1042', field: Status, equals: Open }
        waits: Dell's contract
  - read_now: cases
    checks:
      - field: { table: Cases, key: '1042', field: Status, equals: Closed }
        waits: Dell's contract
  - customer_does: case-1042-reopened
  - say: Set case 1042's status to Closed again.
    checks:
      - reply_matches: 'changed since'
        waits: Dell's contract
      - connector_calls: { words: 'Cases: set', count: 1 }
        waits: Dell's contract
