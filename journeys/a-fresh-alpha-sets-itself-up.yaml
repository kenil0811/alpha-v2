name: a-fresh-alpha-sets-itself-up
title: The owner of a fresh Alpha with interviews off goes through Welcome, Claude, Your workspace, Connect, Your people and Done, and lands on a Home that works
why: >
  Onboarding redesigned (Kenil's calls, 22 Nov): every Alpha has a first run, with or without
  interviews (call 2), and nothing has to be ready before handover (call 6). On a fresh server
  nothing works until Claude is set, so Claude is the owner's second chapter while no model is set,
  with a live check that Claude answered (call 7). Your workspace takes the name and who the work
  is for (call 20), Connect shows what landed counted by code (calls 8, 13), Your people adds a
  colleague and gives a one-time link, sending no mail (call 22). Done lands on Home with no row
  left. With interviews off, no trace of them anywhere (rules P1). A made-up bookshop.
claude: unset
steps:
  - connect: { connector: gmail, account: ana@harborbooks.example }
    checks:
      # no model yet: Claude is in the story, and it is the owner's whole path with interviews off
      - story:
          chapters: [welcome, claude, workspace, connect, people, done]
          at: welcome
          done: false
          row: 'Carry on setting up'
  - story: { chapter: welcome }
  # Claude cannot be skipped while no model is set (call 5)
  - story: { chapter: claude, skip: true, refused: true }
    checks:
      - story: { at: claude }
  - story: { chapter: claude, body: { token: '{claude}' } }
    checks:
      - story: { at: workspace }
  - story:
      chapter: workspace
      body: { name: Harbor Books, for: 'Harbor Books, our bookshop: me and two staff.' }
    checks:
      - story_says: { chapter: workspace, matches: 'Harbor Books' }
  # what landed, counted by code
  - story: { chapter: connect }
    checks:
      - story_says: { chapter: connect, matches: '\d+ (mails|emails)' }
  - story: { chapter: people, body: { add: [{ name: Priya, email: priya@harborbooks.example }] } }
    checks:
      # a one-time link to copy, and no mail sent for it
      - story_says: { chapter: people, matches: 'Priya', never: 'sent' }
      - connector_calls: { words: 'Gmail: send', count: 0 }
  - story: { chapter: done }
    checks:
      - story: { done: true, row: null }
      - no_trace: interviews
      - needs_you: { count: 0 }
      - errors: 0
  # Home works: Claude answers the owner's first question
  - say: What can you do for me?
    checks:
      - errors: 0
