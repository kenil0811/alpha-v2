name: track-what-i-eat
title: '"track what I eat" makes a table at once, and "log two eggs" lands a row in it'
why: >
  Week 1's skeleton (design §19): one sentence end to end on a fresh tenant. A standing thing
  is made in the turn and said in a line; the log lands in it with the person's words as its
  source; nothing waits on a gate.
steps:
  - say: track what I eat
    checks:
      - tables: 1
      - rows: 0
      - permission_cards: 0
      - errors: 0
  - say: log two eggs
    checks:
      - tables: 1
      - rows: 1
      - stated: { matches: egg, from: log two eggs }
      - stated: { matches: '\b(2|two)\b', from: log two eggs }
      - permission_cards: 0
      - errors: 0
