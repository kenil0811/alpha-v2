name: a-quiet-month-wakes-no-one
title: A month after the owner goes through Set up Alpha, the Interviewer's check finds nothing new and wakes no one
why: >
  Regular interviews (Kenil's 18 Nov calls 35 to 37, kept by the 22 Nov redesign, call 21): a
  check on the Interviewer's schedule, monthly from the person's first time through Get to know
  you, only looks. It wakes the Interviewer only when it finds something, as a Home row whose short
  interview opens the story; a month with nothing new costs nothing, leaves no row and no task. A
  made-up bookkeeper who goes through the story at once, letting Alpha read nothing.
plugins: [interviews]
steps:
  - story: { chapter: welcome }
  - story: { chapter: workspace, body: { for: 'Just me, doing the books for a few shops.' } }
  - story: { chapter: connect }
  - story: { chapter: know, body: { off: [alpha] } }
  - story: { chapter: people, skip: true }
  - story: { chapter: learned, answers: [] }
  - story: { chapter: done }
    checks:
      - story: { done: true, row: null }
      - schedule: { agent: Interviewer, count: 2, check: true }
      - errors: 0
  - due: { days: 31 }
    checks:
      - last_run_words: { agent: Interviewer, matches: 'Nothing new' }
      # no Home row, no task, nothing in Needs you
      - story: { row: null }
      - task: { title: A short interview, count: 0 }
      - needs_you: { count: 0 }
      - errors: 0
