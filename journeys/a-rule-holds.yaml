name: a-rule-holds
title: 'a rule said in words, saved on its card, refuses a send outside the firm with no card; a send inside still asks'
why: >
  Rules, core step 2 (Kenil's yes, 27 Oct): a rule the person asks for is shown on a card in code's
  own words and holds only once they Save it. Then a send it denies is refused before it runs,
  quoting the rule, with no card to say yes to; a send it does not cover goes to the gates as
  before. On recorded answers (journeys/fixtures/gmail), never a real account.
steps:
  - connect: { connector: gmail, account: owner@example.com }
    checks:
      - rows_in: { table: Mail, count: 6 }
  - say: From now on, never email anyone outside example.com.
    checks:
      - card: { words: 'Save this rule\? Alpha must never send to an address outside example\.com' }
      - query: { sql: "SELECT id FROM journal WHERE kind = 'rule_saved'", count: 0 }
  - answer: { choice: 'Save' }
    checks:
      - query: { sql: "SELECT id FROM journal WHERE kind = 'rule_saved'", count: 1 }
      - cards_waiting: 0
  # Alpha knows the rule and plans around it: nothing goes and nothing asks
  - say: Email priya@harborcapital.example to ask for the CIM, and send it.
    checks:
      - permission_cards: 0
      - connector_calls: { words: 'Gmail: send', count: 0 }
      - reply_matches: 'rule'
  # asked to try, the send meets the wall: refused before it runs, quoting the rule, no card
  - say: Try sending that email to Priya anyway, so I can see the rule stop it.
    checks:
      - query: { sql: "SELECT words FROM journal WHERE kind = 'refused'", count: 1, matches: 'outside example\.com' }
      - permission_cards: 0
      - connector_calls: { words: 'Gmail: send', count: 0 }
  - say: Now email owner@example.com a note to chase the CIM tomorrow, and send it.
    checks:
      - card: { gate: leaves_world, words: 'owner@example\.com' }
      - connector_calls: { words: 'Gmail: send', count: 0 }
      - errors: 0
