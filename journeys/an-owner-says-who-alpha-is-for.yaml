name: an-owner-says-who-alpha-is-for
title: The owner of a practice says who Alpha is for in Your workspace, in their own words; Alpha reads their site in the background and keeps only what they keep
why: >
  Onboarding redesigned (Kenil's calls, 22 Nov, call 20, carrying the 18 Nov call 10): no fixed
  idea of a firm. Your workspace asks who the work is for, in the owner's own word, and the story
  uses that word from then on. The site is guessed from the email's domain, confirmed with one
  press, and read in the background; what it drafts from it lands in How to work › For everyone
  here only on the owner's Keep, in What I learned. A made-up dental practice and its made-up site;
  the owner calls it "the practice", and lets Alpha read nothing else.
plugins: [interviews]
steps:
  - site: { from: journeys/fixtures/sites/lakeside-dental }
  - connect: { connector: gmail, account: dana@lakesidedental.example }
  - story: { chapter: welcome }
    checks:
      # the site guessed from the domain, offered for one press
      - story_says: { chapter: workspace, matches: 'lakesidedental' }
  - story:
      chapter: workspace
      body:
        for: 'Lakeside Dental, our family practice: two dentists, three hygienists, and Maria at the front desk.'
        site: '{site}'
    checks:
      - errors: 0
  - story: { chapter: computer, skip: true }
  - story: { chapter: connect }
  - story: { chapter: people }
  # every source but the site turned off, so only the site is read
  - story: { chapter: learned, body: { read: { off: [mail, calendar, contacts, alpha] } } }
  - story:
      chapter: learned
      answers:
        - match: 'system|software|tool|book'
          choice: 'ToothTrack for bookings and patient records, and Ledgerly for the books.'
    checks:
      # its site's pages were read
      - site_requests: { path: /, count: 1, at_least: true }
      - site_requests: { path: /team.html, count: 1, at_least: true }
      # kept lines, in the owner's own word for it, and no fixed idea of a firm anywhere
      - how_to_work: { for: everyone, kept: true, at_least: 2, matches: 'practice' }
      - nowhere: { matches: '\bfirm\b', module: Your work }
      # the story speaks of the practice, never of a firm
      - story_says: { chapter: learned, matches: 'practice', never: '\bfirm\b' }
      - errors: 0
  - story: { chapter: done }
    checks:
      - story: { done: true }
      - needs_you: { count: 0 }
