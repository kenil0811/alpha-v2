# Alpha on a person's own PC: the servers' service, inside the Linux Windows runs for Alpha. Its
# secrets' key is not sealed by this Linux but by Windows, for this person; the Windows app hands
# it in at each start, to a file in memory alone, then starts the service. So the service does
# not start with this Linux, only once the key is there.
[Service]
Environment=ALPHA_ON_PC=1
LoadCredentialEncrypted=
LoadCredential=alpha-secrets:/run/alpha/secrets
