<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alpha</title>
    <style>
      :root { color-scheme: light dark; --canvas: #fcfcfd; --ink: #16202b; --ink-3: #6b7785; }
      @media (prefers-color-scheme: dark) { :root { --canvas: #13181e; --ink: #e6ebf0; --ink-3: #8b97a4; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--canvas); color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none; }
      main { text-align: center; }
      h1 { font: 600 22px/1.3 Georgia, serif; margin: 0 0 6px; }
      p { margin: 0; color: var(--ink-3); }
    </style>
  </head>
  <body data-tauri-drag-region>
    <main data-tauri-drag-region>
      <h1>Alpha is starting</h1>
      <p>This window opens Alpha as soon as it answers.</p>
      <p>If it stays here, open Terminal and type: alpha start</p>
    </main>
  </body>
</html>
