# Alpha for Windows, made on GitHub's Windows machine from a windows-* branch: Alpha's Linux (the
# servers' setup and this checkout's release inside an Ubuntu that WSL2 runs, then made a PC's),
# smoke-tested on the very start the Windows app makes (its secrets' key handed in, the service
# started); then exported as one file for the setup program. `pnpm release windows` fetches them.
name: Alpha for Windows
on:
  workflow_dispatch:
    inputs:
      compile_only:
        description: Only compile the Windows app, with a stand-in for Alpha's Linux (a quick check)
        type: boolean
        default: false
      linux_run:
        description: Take Alpha's Linux from this earlier run instead of making it again (its id)
        type: string
        default: ''
  push:
    branches: ['windows-*']
    paths: ['.github/workflows/windows.yml', 'release/windows/**', 'release/server/**', 'desktop/**', 'core/**', 'window/**', 'bridge/**']
env:
  WSL_UTF8: '1'
jobs:
  compile:
    # a quick check while Alpha's Linux is made elsewhere: the app compiles, with a stand-in file
    if: ${{ inputs.compile_only }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The setup program, around a stand-in for Alpha's Linux
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p resources/bridge
          printf 'stand-in\n' | gzip > resources/alpha-linux.tar.gz
          printf '0.0.0\n' > resources/VERSION
          printf 'stand-in\n' > resources/bridge/stand-in
          npx --yes @tauri-apps/cli@2.11.5 build --bundles nsis --config '{"version":"0.0.1"}'
  linux:
    if: ${{ !inputs.compile_only && !inputs.linux_run }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Files kept as they are (a shell script with Windows line ends does not run in Linux)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: A fresh Ubuntu for Intel and AMD, in WSL2, with systemd
        shell: pwsh
        run: |
          wsl --update --web-download
          $url = 'https://cloud-images.ubuntu.com/wsl/releases/24.04/current/ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz'
          Invoke-WebRequest $url -OutFile ubuntu.tar.gz
          New-Item -ItemType Directory -Force C:\alpha-build | Out-Null
          wsl --import AlphaBuild C:\alpha-build ubuntu.tar.gz --version 2
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 did not take the image' }
          wsl -d AlphaBuild -u root -- sh -c "printf '[boot]\nsystemd=true\n' > /etc/wsl.conf"
          wsl --terminate AlphaBuild
      - name: Alpha's Linux, made inside it
        shell: pwsh
        run: |
          wsl -d AlphaBuild -u root -- sh ./release/windows/image.sh
          if ($LASTEXITCODE -ne 0) { throw 'Alpha''s Linux was not made' }
      - name: The smoke test, on the start the Windows app makes
        shell: pwsh
        run: |
          wsl -d AlphaBuild -u root -- sh ./release/windows/smoke-start.sh
          if ($LASTEXITCODE -ne 0) { throw 'Alpha did not start as the Windows app starts it' }
          wsl -d AlphaBuild -u root -- /opt/alpha/node/bin/node ./release/windows/smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'the smoke test failed' }
          $h = curl.exe -s http://127.0.0.1:4700/api/health
          if (-not $h) { throw 'Windows does not reach Alpha' }
          Write-Output "From Windows: $h"
      - name: Emptied again, and exported as one file
        shell: pwsh
        run: |
          wsl -d AlphaBuild -u root -- sh -c "systemctl stop alpha; find /home/alpha/data -mindepth 1 -maxdepth 1 -exec rm -rf {} +; rm -rf /run/alpha /root/pair-link; cat /opt/alpha/pc-version"
          wsl --terminate AlphaBuild
          wsl --export AlphaBuild alpha-linux.tar.gz --format tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'the export failed' }
          Get-Item alpha-linux.tar.gz | Select-Object Name, Length | Format-Table | Out-String | Write-Output
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-linux
          path: alpha-linux.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: What the core said
        if: always()
        shell: pwsh
        run: wsl -d AlphaBuild -u root -- sh -c "journalctl -u alpha -n 60 --no-pager -o cat 2>/dev/null | grep -Ev 't=|link=' || true"
  app:
    # the Windows Alpha app around Alpha's Linux, as one setup program for the person alone
    needs: linux
    if: ${{ always() && !inputs.compile_only && (needs.linux.result == 'success' || inputs.linux_run != '') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alpha-linux
          path: desktop/resources
          run-id: ${{ inputs.linux_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Alpha Bridge's part, for the PC's own folders and browser (Node for Windows and the bundled Bridge)
        # Windows' own tar, which reads Node's zip (Git's in bash takes D: for a host)
        shell: pwsh
        run: |
          pnpm bridge resources win-x64
          if ($LASTEXITCODE -ne 0) { throw 'the Bridge was not made' }
          Copy-Item -Recurse bridge/app/resources/bridge desktop/resources/bridge
      - uses: dtolnay/rust-toolchain@stable
      - name: The setup program
        working-directory: desktop
        shell: bash
        run: |
          version="0.1.${{ github.run_number }}"
          printf '%s\n' "$version" > resources/VERSION
          npx --yes @tauri-apps/cli@2.11.5 build --bundles nsis --config "{\"version\":\"$version\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-setup
          path: desktop/target/release/bundle/nsis/*-setup.exe
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  install:
    # the setup program on a Windows machine, as the person would run it, with no window: put in
    # place, Alpha installing itself, answering on this PC, then uninstalled with its data saved
    needs: app
    if: ${{ always() && needs.app.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alpha-setup
      - name: The setup program, then Alpha installing itself
        shell: pwsh
        run: |
          $setup = Get-ChildItem *-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $app = "$env:LOCALAPPDATA\Alpha\Alpha.exe"
          if (-not (Test-Path $app)) { throw "the app is not at $app" }
          wsl --update --web-download
          # not -Wait: that waits for the engine's starter too, which runs on by design
          Start-Process -FilePath $app -ArgumentList '--install-quietly'
          $log = "$env:LOCALAPPDATA\AlphaData\install.log"
          $end = ''
          for ($i = 0; $i -lt 150 -and -not $end; $i++) {
            Start-Sleep 10
            if (Test-Path $log) { $end = Select-String -Path $log -Pattern '^(done|failed|restart): ' | Select-Object -Last 1 }
          }
          Get-Content $log -ErrorAction SilentlyContinue | Write-Output
          if (-not $end -or "$end" -notmatch 'done: ') { throw 'Alpha did not install itself' }
      - name: Alpha answers on this PC, as the person's own, and keeps answering
        shell: pwsh
        run: |
          for ($i = 1; $i -le 6; $i++) {
            $h = curl.exe -s -m 5 http://127.0.0.1:4700/api/health
            if (-not $h) { throw "Alpha stopped answering after $($i * 30 - 30) s" }
            Start-Sleep 30
          }
          Write-Output "Answers: $h"
          wsl -l -v
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run | Format-List | Out-String | Write-Output
          if (-not (Test-Path "$env:LOCALAPPDATA\AlphaData\secrets.key")) { throw 'no sealed key' }
          wsl -d Alpha -u root -- sh -c "test -s /run/alpha/secrets && echo the key is handed in, in memory alone; grep -c Smoke /home/alpha/data/alpha.yaml || true"
      - name: The app by the clock pairs this PC with its Alpha by itself (Alpha Bridge's part)
        shell: pwsh
        run: |
          Start-Process -FilePath "$env:LOCALAPPDATA\Alpha\Alpha.exe" -ArgumentList '--quietly'
          $t = "$(wsl -d Alpha -u root -- cat /home/alpha/data/token)".Trim()
          Write-Output "::add-mask::$t"
          $online = @()
          for ($i = 0; $i -lt 30 -and $online.Count -eq 0; $i++) {
            Start-Sleep 10
            $c = curl.exe -s -m 5 -H "x-alpha-token: $t" http://127.0.0.1:4700/api/computers | ConvertFrom-Json
            $online = @($c.computers | Where-Object { $_.online })
          }
          Get-Content "$env:LOCALAPPDATA\AlphaData\bridge\bridge.log" -ErrorAction SilentlyContinue | Select-String -NotMatch 'pair=|t=' | Select-Object -Last 20 | Out-String | Write-Output
          if ($online.Count -eq 0) { throw 'this PC did not pair with its Alpha' }
          $online | Select-Object name, platform, online | Format-Table | Out-String | Write-Output
          # the token's hash alone, to know this Alpha's data again after it is brought back
          $sum = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($t)))
          "TOKEN_SUM=$sum" >> $env:GITHUB_ENV
      - name: Update from a file reads the file inside Alpha's Linux, and refuses one Kenil did not sign
        shell: pwsh
        run: |
          $d = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\upd"
          Set-Content "$d\alpha-server-0.0.0-test.tar.gz" 'not a release'
          Set-Content "$d\alpha-server-0.0.0-test.tar.gz.sig" 'not a signature'
          tar -cf "$env:RUNNER_TEMP\alpha-update-test.tar" -C $d alpha-server-0.0.0-test.tar.gz alpha-server-0.0.0-test.tar.gz.sig
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Alpha\Alpha.exe" -ArgumentList '--update-from', "$env:RUNNER_TEMP\alpha-update-test.tar"
          $said = Get-Content "$env:LOCALAPPDATA\AlphaData\update.log" -Raw
          Write-Output "It said: $said"
          if ($said -notmatch 'not updated: .*not signed') { throw 'the file was not checked as an update inside Linux' }
          if (-not (curl.exe -s -m 5 http://127.0.0.1:4700/api/health)) { throw 'Alpha stopped answering' }
      - name: Uninstalled, with its data saved on this PC
        shell: pwsh
        run: |
          $u = "$env:LOCALAPPDATA\Alpha\uninstall.exe"
          Start-Process -Wait -FilePath $u -ArgumentList '/S'
          Start-Sleep 10
          wsl -l -q
          $saved = Get-ChildItem "$env:LOCALAPPDATA\AlphaData\saved\Alpha data *.tar.gz"
          $saved | Select-Object Name, Length | Format-Table | Out-String | Write-Output
          if (-not $saved) { throw 'the data was not saved' }
          if (wsl -l -q | Select-String -SimpleMatch 'Alpha') { throw 'Alpha''s Linux is still there' }
          # Alpha Bridge's part ended with the app, so its files went too; its pairing went with it
          if (Test-Path "$env:LOCALAPPDATA\Alpha\bridge\node\node.exe") { throw 'the Bridge''s part was left behind' }
          if (Test-Path "$env:LOCALAPPDATA\AlphaData\bridge") { throw 'the Bridge''s pairing was left behind' }
      - name: Installed again, the saved data brought back
        shell: pwsh
        run: |
          $setup = Get-ChildItem *-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $log = "$env:LOCALAPPDATA\AlphaData\install.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          Start-Process -FilePath "$env:LOCALAPPDATA\Alpha\Alpha.exe" -ArgumentList '--install-quietly', '--bring-back'
          $end = ''
          for ($i = 0; $i -lt 90 -and -not $end; $i++) {
            Start-Sleep 10
            if (Test-Path $log) { $end = Select-String -Path $log -Pattern '^(done|failed|restart): ' | Select-Object -Last 1 }
          }
          Get-Content $log -ErrorAction SilentlyContinue | Write-Output
          if (-not $end -or "$end" -notmatch 'done: ') { throw 'Alpha did not install itself again' }
          $t = "$(wsl -d Alpha -u root -- cat /home/alpha/data/token)".Trim()
          Write-Output "::add-mask::$t"
          $sum = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($t)))
          if ($sum -ne $env:TOKEN_SUM) { throw 'the saved data did not come back' }
          Write-Output 'The same Alpha came back, with its data.'
      - name: Uninstalled with its data deleted, nothing of Alpha left on this PC
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Alpha\Alpha.exe" -ArgumentList '--uninstall', '--delete-data'
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Alpha\uninstall.exe" -ArgumentList '/S'
          Start-Sleep 10
          if (wsl -l -q | Select-String -SimpleMatch 'Alpha') { throw 'Alpha''s Linux is still there' }
          if (Test-Path "$env:LOCALAPPDATA\AlphaData\saved") { throw 'the data was kept' }
          if (Test-Path "$env:LOCALAPPDATA\AlphaData\secrets.key") { throw 'the key was kept' }
          Write-Output 'Nothing of Alpha is left on this PC.'
