# Every push and pull request: the checks a contributor runs (pnpm check: typecheck, lint, the
# tests on the plain platform, the platform wall), then every kit and connector in the
# repository against the API being built (the decisions doc's section 5).
name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What the sandbox needs on Linux (bubblewrap, socat, ripgrep; user namespaces allowed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # newer Ubuntu also strips what bubblewrap starts of the capabilities the sandbox's filter
          # needs, as release/server/setup.sh says
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/bwrap-userns-restrict
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          fi
      - name: What the reading browser needs on Linux (the browser tests fetch it themselves)
        run: pnpm --filter @alpha/connector-sdk exec playwright install-deps chromium
      - run: pnpm check
      - run: pnpm kit check core/src/modules/test-kit
      - name: Every connector in the repository
        run: |
          for d in connectors/*/ connectors-extra/*/; do
            [ -f "$d/package.json" ] && pnpm connector check "$d"
          done
