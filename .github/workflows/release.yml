# A tag v<version> makes the release: Alpha as one self-contained app (pnpm release, with its
# own smoke test), signed ad hoc until the Apple account, and the disk image on the GitHub
# release page. The client image (--client) stays by hand, in the client's own repository.
name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'mac -> ../.data/release-cache/mac-target'
      - name: The Tauri command line
        run: cargo install tauri-cli --version '^2' --locked
      - run: pnpm install --frozen-lockfile
      - name: The release, with its smoke test
        run: pnpm release "${GITHUB_REF_NAME#v}"
      - name: The disk image on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .data/release/Alpha-*.dmg \
            --title "Alpha ${GITHUB_REF_NAME#v}" \
            --notes "Alpha ${GITHUB_REF_NAME#v}: open the disk image and drag Alpha to Applications; it installs itself on first open."
