# The second-level names under a country's code (co.uk, com.au, ac.in): a company's domain is the
# one under them, so alerts.sbi.co.in and sbi.co.in are one company.
second_levels: [co, com, ac, org, net, gov, edu, ltd, plc, nic, gen, firm, ind, ne, or, go, sch, mil]

# A meeting makes its attendees people only up to this many people in all, the person included:
# an all-hands invite or a webinar says nothing about who the person knows (Kenil's plan, 21 Oct).
meeting_most_people: 20

# Contact counts are over this many days, said with the number: "12 emails in 90 days".
contact_days: 90
