# Words the walls read for, each with its why. None of these is a setting the person meets.

# A removal of the person's own entries goes without a card only when they asked for it in
# words, and their words said removal: the model's quote of their message must hold one of these.
# Any other quote opens the card.
removal:
  - remove
  - delete
  - clear
  - drop
  - get rid of
  - take out
  - take off
  - erase
  - wipe
  - throw away
  - discard
  - purge

# A browse step whose button or menu item says one of these, as whole words, sends something to other
# people: it is acting, asked once per agent, site and piece of work, as typing is.
# The lists grow from journeys: a miss becomes a journey, then a word here.
browse_acts:
  - share
  - publish
  - post
  - submit
  - invite

# A browse step whose button, menu item or dialog says one of these, as whole words, cannot be taken
# back: it asks every time, even under a yes or an Always ("sign" leaves out sign in, up and out).
browse_each_time:
  - pay
  - buy
  - place order
  - order now
  - checkout
  - transfer
  - send
  - sign
  - delete forever
  - delete permanently
  - empty trash
  - empty bin

# A table named for a period splits one table into many: the shape tool refuses a table's name
# holding one of these words, or matching one of these patterns, as a whole word, and says to keep
# one table with a date on each row instead.
periods:
  words: [january, february, march, april, may, june, july, august, september, october, november, december,
    jan, feb, mar, apr, jun, jul, aug, sep, sept, oct, nov, dec, q1, q2, q3, q4, h1, h2]
  patterns:
    - '\b(19[9]\d|20\d\d)\b'
    - '\bweek\s*\d{1,2}\b'
    - '\bfy\s*\d{2,4}\b'
