# Words the walls read for, each with its why. None of these is a setting the person meets.

# A removal of the person's own entries goes without a card only when they asked for it in
# words, and their words said removal: the model's quote of their message must hold one of these
# (item 11 of the problems list, 25 Oct). Any other quote opens the card.
removal:
  - remove
  - delete
  - clear
  - drop
  - get rid of
  - take out
  - take off
  - erase
  - wipe
  - throw away
  - discard
  - purge

# Interview me: words that end a sitting, and words that pass on one question. A reply that is one
# of these, alone or opening a reply of four words or fewer ("done, thanks"), is read so; anything
# else is an answer ("I don't know" is an answer too: a gap, with who would know).
interview_done:
  - done
  - stop
  - that's enough
  - thats enough
  - enough
  - later
  - not now
  - no more
  - i'm done
  - im done
  - finish
interview_skip:
  - skip
  - pass
  - next
  - next question
