# The never-use list Alpha ships (onboarding plan, 18 Nov, call 39; rules N1): what a connection
# or a computer reads but Alpha never keeps. It is changed here alone, and never shown in Alpha
# (Kenil, 19 Nov). A word matches a whole word of what is read ("loan" never
# matches "loaned"), a phrase its words in a row, and a stem the inside of a word ("bank" matches
# "bankofamerica"), and a shape a key or token by its form, anywhere in what is read (a regular
# expression: hf_ and thirty letters or more). Words that are also everyday work words (chase,
# hinge, court, statement) are left off: a match leaves the whole mail, event, file or request out.

kinds:
  - key: banking
    title: Banking
    words: [banking, paypal, venmo, zelle, wellsfargo, hsbc, barclays, revolut, capitalone,
      citibank, americanexpress, amex, iban, bank statement, wire transfer, routing number,
      sort code, account statement]
    stems: [bank, mortgage]
  - key: health
    title: Health and medical
    words: [doctor, clinic, therapy, therapist, patient, prescription, diagnosis, dentist, dental,
      pharmacy, mychart, webmd, test results, lab results]
    stems: [health, medical, hospital, pharma]
  - key: credentials
    title: Passwords and credentials
    words: [passcode, credentials, otp, 2fa, mfa, two-factor, verification code, security code,
      one-time code, sign-in code, login code, lastpass, 1password, bitwarden]
    stems: [password]
    # keys and tokens by their form: Hugging Face, OpenAI and Anthropic, GitHub, GitLab, AWS,
    # Google, Slack, Stripe, a private key, a signed web token
    shapes:
      - '\bhf_[A-Za-z0-9]{30,}'
      - '\bsk-[A-Za-z0-9_-]{20,}'
      - '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}'
      - '\bgithub_pat_[A-Za-z0-9_]{30,}'
      - '\bglpat-[A-Za-z0-9_-]{20,}'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\bAIza[0-9A-Za-z_-]{35}'
      - '\bxox[abprs]-[A-Za-z0-9-]{10,}'
      - '\b[rs]k_live_[A-Za-z0-9]{20,}'
      - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
      - '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
  - key: legal
    title: Legal matters
    words: [lawsuit, attorney, lawyer, solicitor, subpoena, litigation, divorce, custody,
      court date, legal notice, cease and desist]
    stems: []
  - key: dating
    title: Dating
    words: [tinder, bumble, okcupid, grindr]
    stems: [dating]
  - key: money
    title: Personal money
    words: [payslip, paystub, salary, pension, 401k, tax return, credit card, credit score,
      creditkarma, loan, loans, robinhood, coinbase, binance, crypto, bitcoin]
    stems: []
