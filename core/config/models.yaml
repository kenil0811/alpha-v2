# The model for every desk turn and run, and for checking a pasted Claude token answers.
desk: claude-opus-5-5
# The models an agent can be set to; none chosen is the desk's.
agents:
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-haiku-5-5
# The model each one-question use runs on (no tools, an answer in a schema), one of the models
# above: reading a document, judging (sorting items into the person's groups), and a plugin's own
# question.
asks:
  reading: claude-opus-5-5
  judging: claude-opus-5-5
  plugins: claude-opus-5-5
