# Judgements, each with its why. None of these is a cap on the person's work.

# Rows the model reads in one page of a query: enough to read whole, and it asks for the next
# page with an offset.
query_page_rows: 500

# Hits a search returns: the best twenty are what a reader looks at.
search_hits: 20

# Lines in the matches hint on each message (three).
hint_lines: 3

# Lines of what changed elsewhere since the last turn here, newest first.
changed_lines: 10

# Chunks of a document a read returns at once; the model asks for more with an offset.
document_page_chunks: 200

# How long a journey waits for one step's turn before calling it stuck: a journeys-runner
# judgement, never met by the person.
journey_step_minutes: 10

# Runs of a journey with --times and no number: enough to tell a flaky pass from a sure one.
# A journeys-runner judgement, never met by the person.
journey_times: 3

# Journeys run at once by pnpm journeys, each on its own fresh world (a round one at a time took
# twenty minutes). A journeys-runner judgement, never met by the person.
journeys_at_once: 3

# Characters a question card's question may run to: one short line, read at a glance, never a whole
# preview. What it rests on goes in the card's detail. A wall on the model, never met by the person.
question_characters: 140

# Attempts after the first, for a connector call that reads and failed in passing (a dropped
# connection). A send or a write is never tried again: whether it was done is unknown.
connector_retries: 2

# The most, in all, a connector call waits for a service that asked it to (429, "too many
# requests"), before it says so and stops. A runtime judgement, never met by the person.
connector_busy_wait_seconds: 300

# A sync that holds less than this share of last time's rows is suspect: said, not hidden.
health_fewer_rows_ratio: 0.5

# Nothing new from a connection for this many days is worth a line.
health_quiet_days: 7

# Runs of a schedule that did not finish, one a tick, before a card on Home asks whether to try
# again or leave it.
run_retries: 2

# Hours a one-time yes on a card stays good for: a yes answers the call in front of the person,
# and the same call hours later is out of that context, so it is asked again.
# An Always stays until it is revoked.
yes_hours: 6

# The browser reads a site at a person's pace: a random wait in this range between two pages of
# one site (the human-pace engine).
browser_pace_min_ms: 4000
browser_pace_max_ms: 9000

# The browse tool: a person's moment after a click or a scroll inside a page, and how many of a
# page's elements a step shows the agent before "scroll, or find by words".
browse_step_ms: 900
browse_elements: 250
# A piece of work's browser tab that nobody worked in for this long closes; the work opens its page again.
browse_tab_idle_minutes: 30
# The longest a browse step waits for its page to come to rest (its network idle, or its elements
# no longer changing) before the agent is shown the page as it is.
browse_settle_ms: 8000
# How much of an address's text a browse read gives the agent at once (a site's text export).
browse_read_chars: 60000

# Days a removed row is kept, out of sight, so Bring back or Revert can put it back whole; then the
# daily work deletes it for good. A judgement, never a setting.
keep_removed_days: 30

# Days after which journal lines that only said something was read (queries, searches, syncs
# with nothing new, their done lines) fold into one checkpoint line a day that keeps the chain.
# Writes, sends, cards, rules, reverts, removals and refusals are kept for ever. A judgement,
# never a setting.
journal_fold_days: 90

# A row's parts its view shows, each part's twelve changed most lately with how many in all: a
# client's hundreds of ledger lines would make its page long and slow. Open as a table shows them
# all; the same number as a row's links show.
parts_shown: 12

# An agent's memory is one short fact: a longer note is a skill. A wall for the model, never met by
# the person (OpenBot's figure).
memory_characters: 500

# The essential memories always loaded into a session, newest first; the rest are searched.
essential_memory_bytes: 8192

# How much of the recent conversation a fresh session starts with, so an edit does not make an
# agent forget; it can search the rest.
handover_characters: 32000

# How many of the person's last messages go back word for word after a compaction, since a summary
# loses most of the detail.
messages_after_compaction: 3

# One request of a person makes at most this many asks between agents, then waits for Continue;
# about cost and runaways, and said on a card when it is met.
asks_per_request: 8

# How far one agent can pass work on to another before the chain stops.
hops_in_a_chain: 4
# Tasks one agent works on at the same time; the rest wait in To do.
tasks_at_once: 4
# when a repeating task given to an agent starts, if its due day has no time
repeat_starts_at: "08:00"
