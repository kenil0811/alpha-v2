# Judgements, each with its why. None of these is a cap on the person's work.

# Rows the model reads in one page of a query: enough to read whole, and it asks for the next
# page with an offset.
query_page_rows: 500

# Hits a search returns: the best twenty are what a reader looks at.
search_hits: 20

# Lines in the matches hint on each message (design §6: three).
hint_lines: 3

# Lines of what changed elsewhere since the last turn here, newest first.
changed_lines: 10

# Chunks of a document a read returns at once; the model asks for more with an offset.
document_page_chunks: 200

# How long a journey waits for one step's turn before calling it stuck: a journeys-runner
# judgement, never met by the person.
journey_step_minutes: 10

# Runs of a journey with --times and no number: enough to tell a flaky pass from a sure one
# (item 48 of the problems list, 25 Oct). A journeys-runner judgement, never met by the person.
journey_times: 3

# Attempts after the first, for a connector call that failed in passing (a dropped connection).
connector_retries: 2

# A sync that holds less than this share of last time's rows is suspect: said, not hidden.
health_fewer_rows_ratio: 0.5

# Nothing new from a connection for this many days is worth a line.
health_quiet_days: 7

# Runs of an agent that did not finish, one a tick, before a card on Home asks whether to try
# again or leave it (item 16 of the problems list, 25 Oct).
run_retries: 3

# Lines of a finished reply shown before More: a long reply stays readable without filling the
# conversation (item 63 of the problems list, 25 Oct).
reply_fold_lines: 4

# Hours a one-time yes on a card stays good for: a yes answers the call in front of the person,
# and the same call hours later is out of that context, so it is asked again (item 39, 25 Oct).
# An Always stays until it is revoked.
yes_hours: 6

# Rounds of tool calls Alpha's own loop takes on one message before it stops and says so: a
# wall against a model that never finishes, never met in ordinary work.
loop_rounds_per_turn: 60

# The browser reads a site at a person's pace: a random wait in this range between two pages of
# one site (design §8, the human-pace engine).
browser_pace_min_ms: 4000
browser_pace_max_ms: 9000

# Days a removed row is kept, out of sight, so Bring back or Revert can put it back whole; then the
# daily work deletes it for good (core step 1, Kenil 26 Oct). A judgement, never a setting.
keep_removed_days: 30

# Cards of one agent's runs left waiting on the person before its runs wait too, rather than add
# more: past this, a run is skipped and says so, and like rows go onto the card already waiting
# (Vikas, 29 Oct).
agent_cards_waiting: 10

# Interview me, dynamic (Vikas, 30 Oct: "the number of questions, durations, everything should be
# dynamically decided"): a pool of questions, re-ranked each morning by expected value; a sitting
# asks the most useful first and stops when the next one is worth less than this, or the person
# says they are done or answers briefly. No count, no duration.
interview_stop_value: 4

# A skipped question's value is multiplied by this for each skip, so it sinks without vanishing.
interview_skip_decay: 0.5

# An answer of this many words or fewer ends the sitting after it is kept: the person is busy.
interview_brief_words: 2

# Questions the model words in one morning, the most valuable first; the rest keep code's words
# until their turn comes.
interview_word_per_day: 20

# An answer older than this many days is stale: its question comes back to the pool, once.
interview_answer_stale_days: 120

# How much a question's age adds: a question not asked for interview_stale_days gains this share
# of its value, so the pool turns over instead of asking the same top few forever.
interview_age_boost: 0.5

# A table nobody changed for this many days is worth one question: still used, or kept elsewhere?
interview_stale_days: 30

# How much each kind of question weighs: a question's value is its weight, times what it holds up
# (rows blank, modules and agents it helps), times its age, times its skips. The business's aims
# come first (the research, 28 Oct: the owner's goals, then where time leaks), then what already
# waits on the person; the standing bank's kinds (interview-bank.yaml) sit among them.
interview_weights:
  goals: 6
  card: 5
  agent: 5
  rule: 4
  aim: 4
  walk: 3
  empty: 3
  blank: 2
  stale: 2
  meaning: 1
  framing: 4
  roles: 3
  tools: 3
  steps: 3
  exceptions: 2
  gaps: 2
  numbers: 3

# Research, Alpha's workspace skill (30 Oct): a bounded web look, reading only. At most this many
# searches, this many pages read, this many minutes; past any, it writes the brief from what it has.
research_searches: 12
research_pages: 20
research_minutes: 10
# Where a search is read, {q} the words; a page of links the browser opens as a person would.
research_search_url: 'https://html.duckduckgo.com/html/?q={q}'
# Characters of each page the model reads for the brief.
research_page_chars: 4000

# Governance, Alpha's workspace skill (30 Oct): an agent whose runs hit a wall this many times in
# governance_days is flagged to the person, with what refused it.
governance_wall_runs: 3
governance_days: 7
