# A made-up managed kit for the rule tests (docs/rules.md, M1 to M3): never a client's. Managed
# takes a signed pack: the rule world signs it with a test key.
name: Case desk
version: 0.1.0
api: 2
managed: true
tables:
  - name: Cases
    about: One case the desk keeps.
    fields:
      - { name: Number, kind: text, about: The case's own number. }
      - { name: Status, kind: choice, choices: [Open, Closed], about: Where the case stands. }
