# Alpha's own kit (decision 13, 24 Oct): the agents that speak for Alpha, installed and kept up to
# date by the core; never uninstalled, each can be paused. Morning is all of Alpha's
# proactiveness; Watson notices what the person said. Every table and field says what it means
# (the semantic layer, 24 Oct).
name: Alpha
api: 1
version: 0.3.2
core: true
# what it is for (core step 3e)
business_case:
  for: The person, and only them
  keeps: The decisions and facts they said in conversation, kept once they say yes
  decides: What to start the day with, which promises become tasks, and what Alpha should remember
description: >
  Alpha's own agents. Morning, at 07:30: what is due, what changed overnight, what comes, and one
  or two suggestions on a card. Watson, at 12:30 and 18:30: what the person said since last time,
  the promises as proposed tasks, the decisions and facts for their yes.
tables:
  - name: Decisions
    about: "A decision the person made in conversation, noticed by Watson and kept once they say so."
    fields:
      - { name: Decision, kind: text, about: "The decision in a sentence, as the person said it." }
      - { name: Said on, kind: date, about: "The day the person said it." }
      - name: State
        kind: choice
        choices: [Proposed, Kept, Dropped]
        tones: { Proposed: warn, Kept: good }
        about: "Proposed until the person keeps it or drops it on Watson's card."
      - { name: Why, kind: text, about: "The words of the person's that Watson read it from." }
    views:
      - { name: Kept, default: true, about: "The decisions the person confirmed.", filters: { rules: [{ field: State, op: is, value: Kept }] } }
      - { name: Proposed, about: "What Watson noticed and the person has not decided on yet.", filters: { rules: [{ field: State, op: is, value: Proposed }] } }
  - name: Noticed
    about: "A fact about a person or a company the person stated in conversation, noticed by Watson and kept once they confirm it."
    fields:
      - { name: About, kind: text, about: "Who or what the fact is about, as the person named them." }
      - { name: Fact, kind: text, about: "The fact in a sentence, as the person said it." }
      - { name: Said on, kind: date, about: "The day the person said it." }
      - name: State
        kind: choice
        choices: [Proposed, Confirmed, Dropped]
        tones: { Proposed: warn, Confirmed: good }
        about: "Proposed until the person confirms it or drops it on Watson's card."
      - { name: Why, kind: text, about: "The words of the person's that Watson read it from." }
    views:
      - { name: Confirmed, default: true, about: "The facts the person confirmed.", filters: { rules: [{ field: State, op: is, value: Confirmed }] } }
      - { name: Proposed, about: "What Watson noticed and the person has not confirmed yet.", filters: { rules: [{ field: State, op: is, value: Proposed }] } }
network: []
