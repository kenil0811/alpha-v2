# Alpha's own kit (decision 13, 24 Oct): the agents that speak for Alpha, installed and kept up to
# date by the core; never uninstalled, each can be paused. Morning is all of Alpha's
# proactiveness; Watson notices what the person said.
name: Alpha
api: 1
version: 0.2.0
core: true
description: >
  Alpha's own agents. Morning, at 07:30: what is due, what changed overnight, what comes, and one
  or two suggestions on a card. Watson, at 12:30 and 18:30: what the person said since last time,
  the promises as proposed tasks, the decisions and facts for their yes.
tables:
  - name: Decisions
    fields:
      - { name: Decision, kind: text }
      - { name: Said on, kind: date }
      - name: State
        kind: choice
        choices: [Proposed, Kept, Dropped]
        tones: { Proposed: warn, Kept: good }
      - { name: Why, kind: text }
    views:
      - { name: Kept, default: true, filters: { rules: [{ field: State, op: is, value: Kept }] } }
      - { name: Proposed, filters: { rules: [{ field: State, op: is, value: Proposed }] } }
  - name: Noticed
    fields:
      - { name: About, kind: text }
      - { name: Fact, kind: text }
      - { name: Said on, kind: date }
      - name: State
        kind: choice
        choices: [Proposed, Confirmed, Dropped]
        tones: { Proposed: warn, Confirmed: good }
      - { name: Why, kind: text }
    views:
      - { name: Confirmed, default: true, filters: { rules: [{ field: State, op: is, value: Confirmed }] } }
      - { name: Proposed, filters: { rules: [{ field: State, op: is, value: Proposed }] } }
network: []
