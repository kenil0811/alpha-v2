# Alpha's own People: the people and organizations Alpha knows, joined across address books, mail and
# meetings; every address book Alpha reads lands in its Address book (a Mac's own through Alpha
# Bridge, Outlook, Google), found by its lasting keys.
name: People
version: 0.2.0
api: 3
core: true
people: true
description: >
  The people and organizations the person deals with, one row each, joined across their contacts,
  mail and meetings.
business_case:
  for: Everyone at the firm
  keeps: Everyone the person deals with, and the organizations they are with
  decides: Who to talk to, and what was last said
tables:
  - name: Address book
    about: "Everyone your address books hold, read and never written back; People is these rows, joined with the people you write to and meet. Connect one in Intelligence › Connections: your Mac's own through Alpha Bridge, Outlook, or Google."
    fields:
      - { name: Name, kind: text, about: "The person, or the organization when the card has no name." }
      - { name: Company, kind: text, about: "Where they work." }
      - { name: Emails, kind: text, about: "Their addresses." }
      - { name: Phones, kind: text, about: "Their numbers." }
      - { name: Title, kind: text, about: "Their role." }
      - { name: Profile, kind: text, about: "Their LinkedIn profile, when the card has one." }
      - { name: Is you, kind: choice, choices: ["yes", "no"], about: "Whether the card is your own." }
    people:
      each: person
      name: Name
      company: Company
      title: Title
      emails: Emails
      phones: Phones
      profile: Profile
      you: { field: Is you, is: "yes" }
    views:
      - name: Everyone
        default: true
        sorts: [{ field: Name, dir: asc }]
        about: "Everyone in your address books"
