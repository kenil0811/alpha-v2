# Alpha's own Network (Kenil, 21 Oct: a default module for every client), installed at start.
# Every table and field says what it means (the semantic layer, 24 Oct).
name: Network
api: 1
version: 0.4.0
# People and Organizations are this module's tabs (UI batch 2, 26 Oct)
people: true
description: >
  Who the person knows: everyone and every organization, as People and Organizations, with lists
  from the tables whose rows are people. LinkedIn's export of their connections, dropped in, adds
  each one.
tables:
  - name: LinkedIn
    about: "One of the person's LinkedIn connections, as the LinkedIn connector read it; each is one of the people Alpha knows."
    # each connection is one of the person's people, at their company, by their profile link
    people: { each: person, name: Name, profile: Profile, emails: Email, company: Company, title: Position }
    fields:
      - { name: Name, kind: text, about: "The connection's name on LinkedIn." }
      - { name: Profile, kind: link, about: "Their LinkedIn profile." }
      - { name: Email, kind: email, about: "Their email, when LinkedIn shows it." }
      - { name: Company, kind: text, about: "Where they work, as LinkedIn shows it." }
      - { name: Position, kind: text, about: "Their title there." }
      - { name: Connected on, kind: date, about: "When the person and they connected on LinkedIn." }
network: []
# Circles and what fed them (Members, Closeness, its rules, Follow-ups and their Notes) are no tab
# or list of Network's (Vikas, 30 Oct): People's lists come from the tables whose rows are people.
history:
  removed:
    - { table: Members, in: 0.4.0 }
    - { table: Follow-ups, in: 0.4.0 }
    - { table: Closeness, in: 0.4.0 }
    - { table: Closeness rules, in: 0.4.0 }
    - { table: Notes, in: 0.4.0 }
    - { table: Circles, in: 0.4.0 }
