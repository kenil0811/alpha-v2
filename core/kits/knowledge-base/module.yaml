# Alpha's own Knowledge Base (Vikas, 2 Nov: Documents and Reports as its two tabs, with an
# Overview), installed at start.
name: Knowledge Base
api: 1
version: 0.1.0
description: >
  What the business knows, written down: its documents (contracts, policies, guides, notes) and
  the reports made for it, each with what it is about, to find again and for Alpha to read.
tables:
  - name: Documents
    about: "One document the business keeps: a contract, a policy, a guide or a note."
    fields:
      - { name: Title, kind: text, about: "What the document is called." }
      - { name: Kind, kind: choice, choices: [Contract, Policy, Guide, Note, Other], about: "What sort of document it is." }
      - { name: File, kind: file, about: "The document itself." }
      - { name: Summary, kind: text, about: "What it says, in a line or two." }
      - { name: Added, kind: date, about: "When it was added." }
      - { name: Notes, kind: notes, about: "Anything more about it." }
  - name: Reports
    about: "One report made for the business: what it covers, for when, and what it found."
    fields:
      - { name: Title, kind: text, about: "What the report is called." }
      - { name: Period, kind: text, about: "The time it covers, as \"October 2026\" or \"Q3\"." }
      - { name: Date, kind: date, about: "When it was made." }
      - { name: File, kind: file, about: "The report itself." }
      - { name: Summary, kind: text, about: "What it found, in a line or two." }
      - { name: Notes, kind: notes, about: "Anything more about it." }
